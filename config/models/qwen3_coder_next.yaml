# Qwen3-Coder-Next via a local vLLM server (OpenAI-compatible endpoint).
# Served name: qwen3-coder-next | Endpoint: set LLM_API_BASE (default below).
# Local serving -> no API cost (cost fields omitted). Scale-to-zero: wake the
# model manually before running (first request otherwise blocks 3-13 min).
# Output is isolated under llm_judge_1line_qwen3coder/ via model_tag below.
model_tag: qwen3coder
model:
  model_name: openai/qwen3-coder-next
  model_kwargs:
    api_base: http://localhost:8000/v1   # override with: export LLM_API_BASE
    api_key: EMPTY            # vLLM ignores it; litellm requires a value
    temperature: 0.0
    max_tokens: 8192
    drop_params: true
