# Devstral Small 2 (24B) via a local vLLM server (OpenAI-compatible endpoint).
# Served name: devstral-small-2 | Endpoint: set LLM_API_BASE (default below).
# Local serving -> no API cost (cost fields omitted). Scale-to-zero: wake the
# model before running (first request otherwise blocks 3-13 min or returns 503).
# Output is isolated under llm_judge_1line_devstral/ via model_tag below, so
# DeepSeek (llm_judge_1line/) and Qwen (llm_judge_1line_qwen3coder/) are untouched.
model_tag: devstral
model:
  model_name: openai/devstral-small-2
  model_kwargs:
    api_base: http://localhost:8000/v1   # override with: export LLM_API_BASE
    api_key: EMPTY            # vLLM ignores it; litellm requires a value
    temperature: 0.0
    max_tokens: 8192
    drop_params: true
