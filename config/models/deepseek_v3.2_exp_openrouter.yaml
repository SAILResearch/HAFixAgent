# DeepSeek-V3.2-Exp via OpenRouter
# Used for: BugsInPy experiments (same model version as Defects4J results)
# Pricing source: https://openrouter.ai/deepseek/deepseek-v3.2-exp/pricing
model:
  model_name: openrouter/deepseek/deepseek-v3.2-exp
  model_kwargs:
    temperature: 0.0
    max_tokens: 8192
    drop_params: true
    # $0.27 / 1M input, $0.41 / 1M output
    input_cost_per_token: 2.7e-07
    output_cost_per_token: 4.1e-07
